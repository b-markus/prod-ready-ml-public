# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
#    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
#    -   id: check-added-large-files

-   repo: local
    # Ruff version.
    hooks:
      #### Run the linter.
      ###- id: ruff-check
      ###  types_or: [ python, pyi, pyproject ]
      ###  args: [ --fix ]
      #### Run the formatter.
      ###- id: ruff-format
      ###  types_or: [ python, pyi ]

      - id: ruff-lint
        name: Ruff Lint
        entry: ruff check .
        language: system
        types_or: [ python, pyi, pyproject ]

      - id: ruff-format
        name: Ruff Format
        entry: ruff format .
        language: system
        types_or: [ python, pyi ]
