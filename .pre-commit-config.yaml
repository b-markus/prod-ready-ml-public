# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
#    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
#    -   id: check-added-large-files

-   repo: local
    hooks:
      # -----------------------------
      # Ruff FORMAT (Black replacement)
      # -----------------------------
      - id: ruff-format
        name: Ruff Format
        entry: ruff
        language: system
        types_or: [python, pyi, pyproject]
        args: ["format"]

      # -----------------------------------------
      # Ruff LINT (merged: check + autofix in one)
      # -----------------------------------------
      - id: ruff-lint
        name: Ruff Lint (with autofix)
        entry: ruff
        language: system
        types_or: [python, pyi, pyproject]
        args: ["check", "--fix"]

      # -----------------------------------------
      # Jupyter Notebook formatting (Ruff format)
      # -----------------------------------------
      - id: ruff-format-notebooks
        name: Ruff Format (Jupyter)
        entry: ruff
        language: system
        types_or: [jupyter]
        args: ["format"]

      ## -----------------------------------------
      ## Jupyter Notebook linting (with autofix)
      ## -----------------------------------------
      #- id: ruff-lint-notebooks
      #  name: Ruff Lint (Jupyter, with autofix)
      #  entry: ruff
      #  language: system
      #  types_or: [jupyter]
      #  args: ["check", "--fix"]

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
    hooks:
      - id: mypy
